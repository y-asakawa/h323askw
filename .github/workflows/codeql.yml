name: CodeQL

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "0 18 * * 6"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C/C++
    runs-on: macos-15

    steps:
      - name: Checkout H323ASKW
        uses: actions/checkout@v7
        with:
          path: h323askw

      - name: Checkout PTLib
        uses: actions/checkout@v7
        with:
          repository: willamowius/ptlib
          path: ptlib

      - name: Checkout H323Plus
        uses: actions/checkout@v7
        with:
          repository: willamowius/h323plus
          path: h323plus

      - name: Install build dependencies
        run: |
          brew update
          brew install automake bison flex openssl@3 pkg-config qt speexdsp ffmpeg x264

      - name: Build PTLib
        working-directory: ptlib
        run: |
          ./configure --enable-ipv6 --disable-odbc --disable-sdl --disable-lua --disable-expat
          make optnoshared

      - name: Build H323Plus
        working-directory: h323plus
        env:
          PWLIBDIR: ${{ github.workspace }}/ptlib
        run: |
          ./configure --enable-h235 --enable-h235-256 --enable-h46017 --enable-h46026 --enable-h46019m --enable-h249 --enable-h46025 --enable-h460p --enable-h460pre --enable-h460com --enable-h460im --enable-h461 --enable-t120 --enable-t140 --enable-aec
          make optnoshared

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp

      - name: Build H323ASKW
        working-directory: h323askw
        env:
          PWLIBDIR: ${{ github.workspace }}/ptlib
          OPENH323DIR: ${{ github.workspace }}/h323plus
          PKG_CONFIG_PATH: /opt/homebrew/opt/qt/lib/pkgconfig:/opt/homebrew/opt/openssl@3/lib/pkgconfig
        run: make video

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
